name: Example app on GitHub Pages

# Builds the example app for the web and publishes it to GitHub Pages on
# every push to main or feature-expansion.
#
# Needs Settings → Pages → Source: "GitHub Actions" (not "Deploy from a
# branch", which only serves / or /docs of a branch as static files). A
# branch other than the default must also be allowed under Settings →
# Environments → github-pages → Deployment branches.
on:
  push:
    branches: [main, feature-expansion]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: example
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - run: flutter pub get
      - run: flutter build web --release --base-href /turf_dart/
      - uses: actions/upload-pages-artifact@v3
        with:
          path: example/build/web

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
